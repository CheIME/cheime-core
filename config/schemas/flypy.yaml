# CheIME Flypy (小鹤双拼) schema.
#
# Flypy uses a native double-pinyin segmentor that converts raw
# double-pinyin key codes directly into canonical syllable graph edges.
# The decoder, dictionaries, user learning, and ranker are shared with
# quanpin and see only canonical pinyin syllables.

schema_version: 1

extends:
  - "../schemas/base.yaml"

engine:
  input:
    type: double_pinyin
    scheme:
      preset: flypy

    keyboard_mistouch:
      enabled: true
      cost: 350000
      layout: qwerty

    # Code confusion is opt-in: it needs explicit rules.
    code_confusion:
      enabled: false
      cost: 250000

  # NOTE: config merge PREPENDS child list fields to parent lists
  # (merge.rs merge_configs) — base.yaml already provides the dict
  # translator, so flypy.yaml must NOT repeat it (two DictTranslators
  # would double every dictionary query per keystroke).
  translators:
    - type: emoji

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba"
  max_code_length: 2  # double-pinyin: exactly 2 keys per syllable
  delimiter: "'"

menu:
  page_size: 9
